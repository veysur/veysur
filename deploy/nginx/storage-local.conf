# cspell:ignore nosniff
# Local-disk storage: the API serves and receives files from the veysur-files
# volume. Included by nginx.conf inside the server block.
# Embedded survey artefacts: the pointer is short-lived, per-snapshot files are immutable.
location ~ ^/veysur-files[^/]*/(project-[^/]+/survey/[^/]+/embed/current\.json)$ {
    set $api_backend "api:3838";
    proxy_pass http://$api_backend/storage/veysur-files/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=60, stale-while-revalidate=600" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~ ^/veysur-files[^/]*/(project-[^/]+/survey/[^/]+/embed/[^/]+/[^/]+\.json)$ {
    set $api_backend "api:3838";
    proxy_pass http://$api_backend/storage/veysur-files/$1;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~ ^/veysur-files[^/]*/(.*)$ {
    set $api_backend "api:3838";
    proxy_pass http://$api_backend/storage/veysur-files/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_valid 200 1h;
}

location ~ ^/veysur-private[^/]*/(.*)$ {
    set $api_backend "api:3838";
    proxy_pass http://$api_backend/storage/veysur-private/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_cache_valid 0;
}
