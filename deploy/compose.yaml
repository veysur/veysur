name: veysur

# VeySur self-hosted stack. Configuration comes from `.env` (copy .env.example).

x-api-environment: &api-environment
  DEPLOYMENT_MODE: self-hosted
  NODE_ENV: production
  API_BRAND_NAME: ${API_BRAND_NAME:-VeySur}
  API_WEB_DOMAIN: ${API_WEB_DOMAIN:?set API_WEB_DOMAIN in .env}
  API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
  API_SERVER_PORT: "3838"
  API_CORS_ALLOWED_DOMAINS: ${API_CORS_ALLOWED_DOMAINS:-${API_WEB_DOMAIN}}
  API_PROJECT_OWNER_ID: ${API_PROJECT_OWNER_ID:-}
  API_JWT_KEY: ${API_JWT_KEY:?set API_JWT_KEY in .env}

  MYSQL_HOST: mysql
  MYSQL_DATABASE: ${MYSQL_DATABASE:-veysurAccount}
  MYSQL_DATABASE_IP_LOCATION: ${MYSQL_DATABASE_IP_LOCATION:-veysurIpLocation}
  MYSQL_USER: ${MYSQL_USER:-veysur}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}

  REDIS_ENABLED: "true"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

  # File storage: local disk by default, or an S3-compatible service (see docs/storage.md).
  API_S3_TYPE: ${API_S3_TYPE:-local}
  API_S3_LOCAL_PATH: /data/files
  API_S3_PUBLIC_BUCKET: ${API_S3_PUBLIC_BUCKET:-veysur-files}
  API_S3_PRIVATE_BUCKET: ${API_S3_PRIVATE_BUCKET:-veysur-private}
  API_S3_REGION: ${API_S3_REGION:-us-east-1}
  API_S3_ENDPOINT: ${API_S3_ENDPOINT:-}
  API_S3_FORCE_PATH_STYLE: ${API_S3_FORCE_PATH_STYLE:-false}
  API_S3_PUBLIC_BASE_URL: ${API_S3_PUBLIC_BASE_URL:?set API_S3_PUBLIC_BASE_URL in .env}
  API_S3_ACCESS_KEY_ID: ${API_S3_ACCESS_KEY_ID:-}
  API_S3_SECRET_ACCESS_KEY: ${API_S3_SECRET_ACCESS_KEY:-}
  API_S3_LOCAL_SECRET: ${API_S3_LOCAL_SECRET:-}

  API_MAIL_HOST: ${API_MAIL_HOST:-}
  API_MAIL_PORT: ${API_MAIL_PORT:-587}
  API_MAIL_TRANSPORT_TYPE: ${API_MAIL_TRANSPORT_TYPE:-smtp}
  API_MAIL_SECURE: ${API_MAIL_SECURE:-false}
  API_MAIL_CANARY_TO: ${API_MAIL_CANARY_TO:-}
  API_MAIL_AUTH_USER: ${API_MAIL_AUTH_USER:-}
  API_MAIL_AUTH_PASS: ${API_MAIL_AUTH_PASS:-}
  API_MAIL_ADDRESS_FROM: ${API_MAIL_ADDRESS_FROM:-no-reply@${API_WEB_DOMAIN}}
  API_MAIL_FROM_NAME: ${API_MAIL_FROM_NAME:-${API_BRAND_NAME:-VeySur}}
  API_MAIL_ADDRESS_CONTACT: ${API_MAIL_ADDRESS_CONTACT:-${API_MAIL_ADDRESS_FROM:-no-reply@${API_WEB_DOMAIN}}}
  API_COMPANY_NAME: ${API_COMPANY_NAME:-}
  API_MAIL_BOUNCE_DOMAIN: ${API_MAIL_BOUNCE_DOMAIN:-}
  API_MAIL_IMAP_HOST: ${API_MAIL_IMAP_HOST:-}
  API_MAIL_IMAP_PORT: ${API_MAIL_IMAP_PORT:-993}
  API_MAIL_IMAP_BOUNCE_USER: ${API_MAIL_IMAP_BOUNCE_USER:-}
  API_MAIL_IMAP_BOUNCE_PASS: ${API_MAIL_IMAP_BOUNCE_PASS:-}
  API_MAIL_IMAP_ABUSE_USER: ${API_MAIL_IMAP_ABUSE_USER:-}
  API_MAIL_IMAP_ABUSE_PASS: ${API_MAIL_IMAP_ABUSE_PASS:-}
  API_MAIL_IMAP_CA_CERT: ${API_MAIL_IMAP_CA_CERT:-}

  API_ENCRYPTION_PUBLIC_KEY: ${API_ENCRYPTION_PUBLIC_KEY:-}
  API_ENCRYPTION_PRIVATE_KEY: ${API_ENCRYPTION_PRIVATE_KEY:-}
  API_ENCRYPTION_PRIVATE_KEY_PASSWORD: ${API_ENCRYPTION_PRIVATE_KEY_PASSWORD:-}

  BUGSINK_DSN: ""

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${VEYSUR_HTTP_PORT:-80}:80"
      - "${VEYSUR_HTTPS_PORT:-443}:443"
      - "${VEYSUR_HTTPS_PORT:-443}:443/udp"
    environment:
      VEYSUR_SITE_ADDRESS: ${VEYSUR_SITE_ADDRESS:-${API_WEB_DOMAIN}}
      VEYSUR_ACME_EMAIL: ${VEYSUR_ACME_EMAIL:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${VEYSUR_TLS_SNIPPET:-./caddy/tls-auto.caddy}:/etc/caddy/tls.caddy:ro
      - ./certs:/certs:ro
      - veysur-caddy-data:/data
      - veysur-caddy-config:/config
    depends_on:
      nginx:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  nginx:
    image: ${VEYSUR_IMAGE_REGISTRY:-ghcr.io/veysur}/nginx:${VEYSUR_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.nginx
      args:
        BUILD_VERSION: ${VEYSUR_IMAGE_TAG:-latest}
        PUBLIC_CORE_SHA: ${VEYSUR_GIT_SHA:-}
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${VEYSUR_STORAGE_SNIPPET:-./nginx/storage-local.conf}:/etc/nginx/storage.conf:ro
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M

  api:
    image: ${VEYSUR_IMAGE_REGISTRY:-ghcr.io/veysur}/api:${VEYSUR_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *api-environment
      # Caps V8's heap to fit the container memory limit below - without this,
      # V8 sizes its heap off available host memory, not the cgroup limit, so
      # a lower memory limit alone would just move where an OOM-kill happens.
      NODE_OPTIONS: --max-old-space-size=256
    volumes:
      - veysur-files:/data/files
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 350M

  # Runs the task manager once a minute with the same entrypoint the Kubernetes
  # CronJob used. The timeout stops a hung run from stalling the loop; the
  # heartbeat file drives the healthcheck.
  task-manager:
    image: ${VEYSUR_IMAGE_REGISTRY:-ghcr.io/veysur}/api:${VEYSUR_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *api-environment
      API_TASK: taskManager
      API_ACTION: run
      NODE_OPTIONS: --max-old-space-size=256
    entrypoint:
      - sh
      - -c
      - >-
        while true; do
        timeout -s KILL 600 node dist/run.js;
        touch /tmp/task-manager-heartbeat;
        sleep 60;
        done
    volumes:
      - veysur-files:/data/files
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/task-manager-heartbeat -mmin -12 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 350M

  # One-shot migration runner, not started by `up`. Arguments are appended:
  #   docker compose run --rm migrate [--dry-run] [--verbose]
  migrate:
    image: ${VEYSUR_IMAGE_REGISTRY:-ghcr.io/veysur}/api:${VEYSUR_IMAGE_TAG:-latest}
    profiles: ["tools"]
    environment:
      <<: *api-environment
      MYSQL_ENSURE_DATABASE: "true"
    entrypoint: ["node", "dist/script/migrate.js", "--datasource", "account"]
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Overrides custom.cnf's innodb_buffer_pool_size - MySQL's command-line
    # options take precedence over option files, and this lets the buffer pool
    # scale with MYSQL_BUFFER_POOL_MB (see config-generate.sh) without needing
    # to template/regenerate the mounted .cnf file.
    command: ["--innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_MB:-512}M"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-veysurAccount}
      MYSQL_DATABASE_IP_LOCATION: ${MYSQL_DATABASE_IP_LOCATION:-veysurIpLocation}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:-veysur}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - veysur-mysql-data:/var/lib/mysql
      - veysur-mysql-logs:/var/log/mysql
      - ./mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - ./mysql/init-database.sh:/docker-entrypoint-initdb.d/init-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: ${MYSQL_MEMORY_LIMIT_MB:-1250}M

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - >-
        exec redis-server --requirepass "$$REDIS_PASSWORD"
        --maxmemory 256mb --maxmemory-policy allkeys-lru
        --save "" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  veysur-files:
  veysur-mysql-data:
  veysur-mysql-logs:
  veysur-caddy-data:
  veysur-caddy-config:
