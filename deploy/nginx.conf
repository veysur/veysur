# cspell:ignore nopush referer nosniff
# Single-origin routing: admin at `/`, `/account`, `/survey`, `/docs`, `/api`.
# Listens on plain HTTP inside the compose network; Caddy terminates TLS in front.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Docker's embedded DNS. Resolving `api` per request (variable proxy_pass)
    # lets nginx start and survive an api container restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Behind Caddy: recover the real client address and scheme from the headers
    # it sets. nginx is not published to the host, so only Caddy reaches it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        server_name _;
        absolute_redirect off;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/5xx.html;

        location ^~ /errors/ {
            root /usr/share/nginx/html;
            internal;
            expires -1;
            add_header Cache-Control "no-store";
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /api/ {
            set $api_backend "api:3838";
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
        }

        # File storage: served by the API from the local volume, or proxied to
        # S3. Chosen by VEYSUR_STORAGE_SNIPPET in compose.yaml.
        include /etc/nginx/storage.conf;

        location /docs/ {
            alias /usr/share/nginx/html/docs/;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # Bundles and shared assets for every app live outside the app roots.
        location /static/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 7d;
        }

        location /image/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 7d;
        }

        location ~ ^/favicon\.(svg|png)$ {
            root /usr/share/nginx/html;
            expires 7d;
        }

        location /account/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /account/index.html;
        }

        location /survey/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /survey/index.html;
        }

        # The admin app is built with the /admin basename (PUBLIC_BASE_ADMIN).
        location = / {
            return 302 /admin/;
        }

        location = /admin {
            return 302 /admin/;
        }

        location /admin/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /admin/index.html;
        }
    }
}
