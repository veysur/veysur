# cspell:ignore nopush referer nosniff
# Single-origin routing: admin at `/`, `/account`, `/survey`, `/docs`, `/api`.
# Plain HTTP on port 80; TLS is layered on separately.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Docker's embedded DNS. Resolving `api` per request (variable proxy_pass)
    # lets nginx start and survive an api container restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/5xx.html;

        location ^~ /errors/ {
            root /usr/share/nginx/html;
            internal;
            expires -1;
            add_header Cache-Control "no-store";
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /api/ {
            set $api_backend "api:3838";
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location ~ ^/veysur-files[^/]*/(.*)$ {
            set $api_backend "api:3838";
            proxy_pass http://$api_backend/storage/veysur-files/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 1h;
        }

        location ~ ^/veysur-private[^/]*/(.*)$ {
            set $api_backend "api:3838";
            proxy_pass http://$api_backend/storage/veysur-private/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 0;
        }

        location /docs/ {
            alias /usr/share/nginx/html/docs/;
            index index.html;
            try_files $uri $uri/ =404;
        }

        location /account/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /account/index.html;
        }

        location /survey/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /survey/index.html;
        }

        location / {
            root /usr/share/nginx/html/admin;
            try_files $uri $uri/ /index.html;
        }
    }
}
