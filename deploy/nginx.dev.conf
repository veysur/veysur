# cspell:ignore nopush referer
# Development proxy: the rsbuild dev server (HMR) and the API behind one origin.
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    absolute_redirect off;
    client_max_body_size 100M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 80;
        server_name _;

        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/5xx.html;

        location ^~ /errors/ {
            root /usr/share/nginx/html;
            internal;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /api/ {
            set $api_backend "api:3838";
            proxy_pass http://$api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location ~ ^/veysur-files[^/]*/(.*)$ {
            set $api_backend "api:3838";
            proxy_pass http://$api_backend/storage/veysur-files/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~ ^/veysur-private[^/]*/(.*)$ {
            set $api_backend "api:3838";
            proxy_pass http://$api_backend/storage/veysur-private/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # The multi-entry dev server serves /admin, /survey and /account.
        location = / {
            return 302 /admin;
        }

        location / {
            set $app_dev_server "app-dev:3000";
            proxy_pass http://$app_dev_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            add_header Cache-Control "no-store";
        }
    }
}
