<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — VeySur</title>
    <style>
      :root {
        --bg: oklch(0.97 0.001 106.424);
        --fg: oklch(0.147 0.004 49.25);
        --muted: oklch(0.374 0.01 67.558);
        --border: oklch(0.869 0.005 56.366);
        --primary: oklch(43.039% 0.11754 137.924);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(0.191 0 0);
          --fg: oklch(0.985 0 0);
          --muted: oklch(0.708 0 0);
          --border: oklch(0.29 0 0);
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background-color: var(--bg);
        color: var(--fg);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
      }
      .container {
        text-align: center;
        max-width: 480px;
      }
      .logo {
        margin-bottom: 2rem;
      }
      .logo svg {
        height: 48px;
        width: auto;
      }
      .code {
        font-size: 6rem;
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(90deg, oklch(from var(--primary) calc(l * 1.24) calc(c * 1.24) h), oklch(from var(--primary) calc(l * 0.94) calc(c * 0.94) h));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1rem;
      }
      .heading {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
      }
      .message {
        color: var(--muted);
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      .divider {
        border: none;
        border-top: 1px solid var(--border);
        margin-bottom: 2rem;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--muted);
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.15s;
      }
      .back-link:hover {
        color: var(--fg);
      }
    </style>
  </head>
