name: Release smoke test

# Installs the thin operator package on a clean runner, with images built from the checkout, and
# checks the stack answers. release.yml runs the same script against the release artefacts; this
# exercises it earlier, when deploy/ changes, and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/release*.yml'

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the thin package
        run: deploy/scripts/release-package.sh 0.0.0-smoke

      - name: Fresh-install smoke test
        run: deploy/tests/release-smoke.sh --tarball deploy/dist/veysur-0.0.0-smoke.tar.gz

  # Upgrades the latest published release to the images built from this checkout.
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download the latest release package
        run: |
          previous=$(gh release view --json tagName -q .tagName)
          gh release download "$previous" --pattern "veysur-${previous#v}.tar.gz" --dir previous

      - name: Upgrade test
        run: deploy/tests/release-upgrade.sh --from-tarball previous/veysur-*.tar.gz

  # Drives the admin and survey apps in Chromium. Not required yet: it reports but does not block
  # until it has run reliably for ten consecutive runs.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          cd deploy/tests/browser
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Build the thin package
        run: deploy/scripts/release-package.sh 0.0.0-smoke

      - name: Browser smoke test
        run: deploy/tests/release-smoke.sh --tarball deploy/dist/veysur-0.0.0-smoke.tar.gz --browser

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            deploy/tests/browser/test-results
            deploy/tests/browser/playwright-report
          retention-days: 7

  # The latest published release as users get it: its tarball and the images from ghcr.io, with no
  # local build. Nightly and on demand only, since it says nothing about a pull request.
  released:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the latest release and pull its images
        run: |
          tag=$(gh release view --json tagName -q .tagName)
          echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
          gh release download "$tag" --pattern "veysur-${tag#v}.tar.gz" --dir release
          for image in api nginx; do docker pull "ghcr.io/veysur/$image:${tag#v}"; done

      - name: Smoke test the published release
        run: deploy/tests/release-smoke.sh --tarball "release/veysur-$VERSION.tar.gz" --registry ghcr.io/veysur --tag "$VERSION"
