name: Secret scan

# Backstop for scripts/check-no-secrets.sh: the local hook can be bypassed with --no-verify.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan full history
        run: bash scripts/check-no-secrets.sh --all
