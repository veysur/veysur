<table
  border="0"
  cellpadding="10"
  cellspacing="0"
  style="
    margin-top: 10px;
    background-color: #006533;
    border: 1px solid #004d26;
    border-radius: 4px;
  "
>
  <tbody>
    <tr>
      <td
        align="center"
        valign="middle"
        style="padding: 10px; border-collapse: collapse"
      >
        <a href="{{href}}" style="text-decoration: none" target="_blank">
          <div
            style="
              text-align: center;
              color: #f5f5f4;
              font-size: 15px;
              font-weight: 500;
              line-height: 15px;
            "
          >
            {{text}}
          </div>
        </a>
      </td>
    </tr>
  </tbody>
</table>
