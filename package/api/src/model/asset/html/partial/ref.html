<table
  border="0"
  cellpadding="10"
  cellspacing="0"
  style="margin-top: 10px; background-color: #e7e5e4; border: 1px solid #d6d3d1"
>
  <tbody>
    <tr>
      <td
        align="center"
        valign="middle"
        style="padding: 10px; border-collapse: collapse"
      >
        <div
          style="
            text-align: center;
            color: #1c1917;
            font-size: 15px;
            font-weight: 500;
            line-height: 15px;
          "
        >
          {{text}}
        </div>
      </td>
    </tr>
  </tbody>
</table>
