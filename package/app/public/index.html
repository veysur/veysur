<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title></title>
    <!-- Add these lines to include Bootstrap CSS and JS -->
    <script>
      // Set theme before page renders to prevent flash
      (function() {
        const match = document.cookie.match(/(?:^|;\s*)veysur-theme=([^;]+)/);
        let theme = match ? match[1] : null;

        // If no stored value or old 'system' value, default to light
        if (!theme || theme === 'system') {
          theme = 'light';
        }

        if (theme === 'dark' || theme === 'light') {
          document.documentElement.classList.add(theme);
          // Apply background color immediately to prevent flash
          document.documentElement.style.backgroundColor = theme === 'dark' ? '#0a0a0a' : '#ffffff';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
